name: Release artifacts

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  binaries:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ''
          - os: macos-14
            target: aarch64-apple-darwin
            suffix: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: '.exe'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI and language server
        run: cargo build --release --locked --target ${{ matrix.target }} -p chipi-cli -p chipi-lsp
      - name: Assemble archive
        shell: bash
        run: |
          mkdir -p dist/chipi
          cp target/${{ matrix.target }}/release/chipi${{ matrix.suffix }} dist/chipi/
          cp target/${{ matrix.target }}/release/chipi-lsp${{ matrix.suffix }} dist/chipi/
          cp README.md LICENSE-MIT LICENSE-APACHE dist/chipi/
          cp -r examples dist/chipi/
          tar -czf chipi-${{ matrix.target }}.tar.gz -C dist chipi
      - uses: actions/upload-artifact@v4
        with:
          name: chipi-${{ matrix.target }}
          path: chipi-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  vscode:
    name: VS Code package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci && npm test && npm run package
        working-directory: editors/vscode
      - uses: actions/upload-artifact@v4
        with:
          name: chipi-vscode
          path: editors/vscode/*.vsix
          if-no-files-found: error
